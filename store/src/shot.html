<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<!-- Store art template. Rendered by store/src/render.js; not part of the app or site. -->
<link rel="stylesheet" href="../../docs/fonts.css">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:var(--w);height:var(--h);overflow:hidden}
body{--w:1080px;--h:1920px;font-family:Inter,system-ui,sans-serif;color:#f3ecdc;position:relative;
 background:radial-gradient(120% 60% at 50% -5%,rgba(201,162,74,.38),transparent 60%),radial-gradient(90% 50% at 100% 100%,rgba(22,128,79,.35),transparent 70%),linear-gradient(180deg,#123524,#0a2116 70%)}
body.light{color:#123524;background:radial-gradient(120% 60% at 50% -5%,rgba(201,162,74,.45),transparent 60%),linear-gradient(180deg,#f7f1e3,#eadfc6)}
body::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1px);background-size:6px 6px;pointer-events:none}
.top{position:absolute;left:0;right:0;top:118px;text-align:center;padding:0 80px}
.eb{font:600 26px/1 Inter;letter-spacing:.28em;text-transform:uppercase;color:#d8b860;display:flex;align-items:center;justify-content:center;gap:18px}
.light .eb{color:#8a6a1f}
.eb::before,.eb::after{content:"";width:56px;height:2px;background:currentColor;opacity:.6}
h1{font:600 104px/.98 'Cormorant Garamond',Georgia,serif;letter-spacing:-.01em;margin-top:34px}
p{font:400 37px/1.38 Inter;opacity:.82;margin:28px auto 0;max-width:860px}
.ph{position:absolute;left:50%;width:812px;transform:translateX(-50%);top:640px;border-radius:84px;padding:16px;background:linear-gradient(145deg,#2a3b31,#060d09 40%,#0b1611);box-shadow:0 60px 120px rgba(0,0,0,.55),0 0 0 2px rgba(216,184,96,.35),inset 0 0 0 2px rgba(255,255,255,.08)}
.ph img{display:block;width:780px;border-radius:68px}
.ph::before{content:"";position:absolute;top:34px;left:50%;width:24px;height:24px;margin-left:-12px;border-radius:50%;background:#030806;box-shadow:inset 0 0 0 4px #14221a;z-index:2}
.trio .ph{width:540px;padding:12px;border-radius:60px;top:720px}
.trio .ph img{width:516px;border-radius:48px}
.trio .ph::before{top:24px;width:18px;height:18px;margin-left:-9px}
.trio .a{transform:translateX(-50%) translateX(-300px) rotate(-8deg) scale(.9);top:780px}
.trio .c{transform:translateX(-50%) translateX(300px) rotate(8deg) scale(.9);top:780px}
.trio .b{z-index:3}
/* feature graphic 1024x500 */
.fg{--w:1024px;--h:500px}
.fg .top{display:none}
.fgt{position:absolute;left:60px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;width:420px;z-index:4}
.fgt img{width:62px;margin-bottom:22px}
.fgt b{font:600 58px/1 'Cormorant Garamond',Georgia,serif;letter-spacing:.02em}
.fgt i{font:italic 400 26px/1.3 'Cormorant Garamond',Georgia,serif;color:#d8b860;margin-top:10px}
.fgt span{font:500 18px/1.5 Inter;max-width:380px;opacity:.8;margin-top:22px;letter-spacing:.02em}
.fg .ph{width:258px;padding:8px;border-radius:34px;top:46px;left:auto;transform:none}
.fg .ph img{width:242px;border-radius:27px}
.fg .ph::before{top:16px;width:10px;height:10px;margin-left:-5px}
.fg .p1{right:222px;transform:rotate(-7deg);top:70px}
.fg .p2{right:18px;transform:rotate(6deg);top:40px;z-index:3}
/* tablet */
.tab{--w:2560px;--h:1600px}
.tab .top{top:88px}
.tab h1{font-size:110px;margin-top:22px}
.tab p{display:none}
.tab .ph{width:1900px;top:400px;border-radius:64px;padding:22px}
.tab .ph img{width:1856px;border-radius:44px}
.tab .ph::before{top:auto;bottom:auto;left:10px;top:50%;margin:-10px 0 0 0;width:20px;height:20px;display:none}
</style></head><body>
<div class="top"><div class="eb">CyPress Reader</div><h1 id="h"></h1><p id="s"></p></div>
<div id="stage"></div>
<script>
const q=new URLSearchParams(location.search),imgs=(q.get('img')||'').split(',');
document.body.className=(q.get('cls')||'');
document.getElementById('h').innerHTML=q.get('t')||'';document.getElementById('s').textContent=q.get('s')||'';
const ph=(src,c)=>`<div class="ph ${c||''}"><img src="../raw/${src}" alt=""></div>`;
const st=document.getElementById('stage');
if(document.body.classList.contains('fg'))st.innerHTML=`<div class="fgt"><img src="../../docs/logo-tree.png" alt=""><b>CyPress Reader</b><i>The art of staying informed.</i><span>Your sites, made into a beautiful daily magazine. Private by design.</span></div>`+ph(imgs[0],'p1')+ph(imgs[1],'p2');
else if(imgs.length===3){document.body.classList.add('trio');st.innerHTML=ph(imgs[0],'a')+ph(imgs[2],'c')+ph(imgs[1],'b')}
else st.innerHTML=ph(imgs[0]);
</script></body></html>
