# Lets David and MJ reach Claude from a GitHub issue or pull request by writing @claude
# in a comment. Copied from anthropics/claude-code-action examples/claude.yml, with the
# OAuth token for authentication instead of an API key.
#
# For this to run at all, this file must be on the DEFAULT branch (main): GitHub reads
# issue_comment workflows from there and nowhere else.
#
# It needs one repository secret: CLAUDE_CODE_OAUTH_TOKEN
# (Settings -> Secrets and variables -> Actions -> New repository secret).
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # so Claude can read the result of a build or test run
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Claude acts through this token instead of the Claude app's own. A push made with the
          # app's token does not start another workflow, so a [apk] commit pushed by Claude would
          # never build; a personal access token's pushes do. It also means Claude's comments and
          # commits appear as the token's owner, and it carries that account's access, not this
          # repository's alone.
          github_token: ${{ secrets.CLAUDE_CODE_PAT }}
