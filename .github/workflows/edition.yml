# CyPress: build the World Edition by itself, twice a day.
#
# David's goal is set-up-once-then-hands-off: nothing in here waits for him. It reads the feeds, picks the day's
# stories by counting, opens every one through the app's own reader, writes the edition file, and then hands it
# to the two robots that look at the magazine. IT PUBLISHES ONLY IF BOTH COME BACK CLEAN. If anything is wrong,
# or too few stories survive, the edition already live stays live and the run says why. The fallback is always
# yesterday's edition, never a broken one.
#
# WHAT IT CANNOT DO YET, and neither can anyone: print a photograph. A picture is only printed once something
# has looked at it (WORLD-EDITION-PIPELINE.md, pass 4), so until that pass exists these editions are type.
name: World Edition

on:
  # THE BUILD IS STARTED BY A PUSH, NOT BY A CLOCK (2026-11-28).
  # GitHub's schedule is "best effort", and for this repository that meant: of every slot since the workflow
  # reached main, exactly ONE was ever delivered - 11:38 on 27 November, which arrived at 20:17, eight hours
  # and thirty-nine minutes late - and the 00:38 after it never came. A late edition is worse than none: it
  # landed after the picture review had run, so it went out with no pictures and nobody had looked at it.
  # A push starts a workflow within seconds. The Claude task that reviews the pictures now STARTS the build
  # itself (`bash .github/edition/kick.sh start`, which pushes a new line into the file below), waits for
  # it, and only then reviews - so the review cannot run ahead of the build, whatever any clock does.
  # The times live on that task (11:38 and 00:38 UTC: David wakes at 7am Pacific, and an issue built at
  # 3:38am his time is fresh at breakfast; the second lands late afternoon for him).
  push:
    branches: [main]
    paths: [".github/edition/RUN"]
  schedule:
    # A FALLBACK ONLY, twenty minutes behind the real start. It builds only when no edition has landed for
    # nine hours (the `gate` job) - which means the push never came. On time or eight hours late, if the
    # slot was already served it does nothing, so a late delivery can no longer replace a reviewed edition.
    - cron: "58 11 * * *"
    - cron: "58 0 * * *"
  workflow_dispatch:
    inputs:
      min:
        description: "Fewest stories that may be published (below this the live edition is kept)"
        default: "10"
      publish:
        description: "Commit and push the edition if the checks pass"
        type: boolean
        default: true

permissions:
  contents: write
  issues: write   # only to tell David when an edition did not publish

concurrency:
  group: edition-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          go=true
          if [ "${{ github.event_name }}" = schedule ]; then
            last=$(gh api "repos/$GITHUB_REPOSITORY/commits?path=docs/app/world-edition.json&per_page=1" --jq '.[0].commit.committer.date' 2>/dev/null || true)
            if [ -n "$last" ]; then
              age=$(( ( $(date -u +%s) - $(date -u -d "$last" +%s) ) / 60 ))
              echo "The edition was last written $age minutes ago." >> "$GITHUB_STEP_SUMMARY"
              if [ "$age" -lt 540 ]; then go=false; echo "This slot was already served, so the fallback does nothing." >> "$GITHUB_STEP_SUMMARY"; fi
            fi
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"

  edition:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Playwright and Chromium
        run: |
          # one more go if the registry or the browser download blinks: a lost install was a lost edition
          for i in 1 2; do
            npm install -g --no-audit --no-fund playwright@1.63.0 && npx -y playwright@1.63.0 install --with-deps chromium && break
            [ "$i" = 2 ] && exit 1; sleep 20
          done

      - name: Pick the day's stories from the feeds
        # --wide also reads MJ's swept publishers whose pictures were verified to load (383 of them, on top of
        # the catalogue's 735). More outlets make the counting that picks the front page better, and a page goes
        # bare when no photograph passes. Measured on run 1: picking took 63s of an 18-minute run, and the rest
        # is reading the stories the desks chose, which their fixed sizes cap - so this costs about 30 seconds.
        run: node scripts/edition/pick.js --wide --json "$RUNNER_TEMP/cand.json"

      - name: Read every one of them
        run: node scripts/edition/gather.js --candidates "$RUNNER_TEMP/cand.json" --deadline 30 --json "$RUNNER_TEMP/got.json"

      - name: Write the edition
        id: write
        run: |
          node scripts/edition/compose.js \
            --candidates "$RUNNER_TEMP/cand.json" --gathered "$RUNNER_TEMP/got.json" \
            --min "${{ inputs.min || '10' }}" --write | tee "$RUNNER_TEMP/compose.txt"
          echo "### The edition" >> "$GITHUB_STEP_SUMMARY"
          sed 's/^/    /' "$RUNNER_TEMP/compose.txt" >> "$GITHUB_STEP_SUMMARY"

      # The robot that looks at the magazine. Both must pass; neither is allowed to be skipped.
      - name: Check every page and spread
        run: OUT="$RUNNER_TEMP/layout" node tests/layout/check.js
      - name: Check that every page paints its own paper
        run: OUT="$RUNNER_TEMP/paint" node tests/layout/paint.js

      - name: Publish it
        id: publish
        # AN UNATTENDED RUN NEVER PUBLISHED, AND SAID "SUCCESS" EVERY TIME (found 2026-11-28).
        # This read `inputs.publish != false`. The box only exists on a run started by hand; on a schedule or
        # a push `inputs.publish` is EMPTY, and in a GitHub expression empty and false both turn into 0, so
        # "empty != false" is FALSE and the step was skipped. Run 6 (the schedule) and run 7 (the first push)
        # each built a whole edition, passed both checks, threw it away and went green. The one edition this
        # workflow ever published, run 5, was started by hand. Now: every automatic run publishes, and a run
        # by hand publishes unless the box is unticked.
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        env:
          DATE: ${{ github.run_id }}
        run: |
          if git diff --quiet -- www/world-edition.json docs/app/world-edition.json; then
            echo "No change to publish." >> "$GITHUB_STEP_SUMMARY"; echo "published=unchanged" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git config user.name "cypressreader"
          git config user.email "davealmaguer@gmail.com"
          git add www/world-edition.json docs/app/world-edition.json
          git commit -m "$(head -1 "$RUNNER_TEMP/compose.txt")

          Written by the scheduled run. Both checks came back clean before this was committed;
          had either found a problem, the edition already live would have been kept.

          $(sed -n '2,20p' "$RUNNER_TEMP/compose.txt")"
          # An edition takes about fifteen minutes to build, and anything that lands on main meanwhile makes
          # this push a non-fast-forward and throws the whole edition away at the last step (run 4, 27 Nov:
          # every check green, then one second of failure because a commit had landed while it worked).
          # Rebasing is safe here because this commit only ever touches the two edition files.
          for try in 1 2 3; do
            git push && { echo "published=yes" >> "$GITHUB_OUTPUT"; exit 0; }
            echo "push rejected; someone else committed while the edition was building (attempt $try)"
            git pull --rebase origin "$(git rev-parse --abbrev-ref HEAD)" || exit 1
            sleep 5
          done
          echo "::error title=Not published::main kept moving under the edition; nothing was published."
          exit 1

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edition-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/layout
            ${{ runner.temp }}/paint
            ${{ runner.temp }}/cand.json
            ${{ runner.temp }}/got.json
          retention-days: 14

      - name: Say what went wrong
        if: failure()
        run: |
          {
            echo "### The edition was not published"
            echo "A step failed, so the edition already live stays live. The screenshots and the two reports are in this run's artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      # NOBODY WAS TOLD WHEN AN EDITION FAILED (review of 2026-11-27). Keeping the old edition is the right thing
      # to do and it was completely silent: the magazine could have gone stale for days. GitHub emails the
      # repository owner about a new issue, so an issue IS the alert. One issue is kept open and added to, rather
      # than a new one every twelve hours, and it is closed by hand once somebody has looked.
      - name: Tell David the edition did not publish
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="The World Edition build did not publish on $(date -u '+%a %d %b, %H:%M UTC'), so the edition already live stays live. Run: $RUN_URL"
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'in:title "The World Edition did not publish"' --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$n" ]; then gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body "$body" || true
          else gh issue create --repo "$GITHUB_REPOSITORY" --title "The World Edition did not publish" --body "$body" || true; fi


      # WHOEVER STARTED THIS BUILD IS WAITING FOR IT, and has only plain git to look with (the Claude task
      # carries no GitHub connector). So the outcome goes to a one-file branch, replaced on every run - the
      # same way the device test hands back its results. `kick` is the line that started this build, which
      # is how `.github/edition/kick.sh wait` knows the answer is for ITS build and not the one before.
      - name: Report back
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          d="$RUNNER_TEMP/status"; mkdir -p "$d"
          kick="$(tr -d '[:space:]' < .github/edition/RUN 2>/dev/null || true)"
          line="$(head -1 "$RUNNER_TEMP/compose.txt" 2>/dev/null | tr -d '"\\' || true)"
          printf '{\n "kick": "%s",\n "published": "%s",\n "result": "%s",\n "edition": "%s",\n "at": "%s",\n "run": "%s"\n}\n' \
            "$kick" "${{ steps.publish.outputs.published || 'no' }}" "${{ job.status }}" "$line" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > "$d/status.json"
          cat "$d/status.json"
          cd "$d" && git init -q -b edition-status . && git add -A
          git -c user.name=edition -c user.email=edition@users.noreply.github.com commit -qm "Edition build of ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" edition-status
