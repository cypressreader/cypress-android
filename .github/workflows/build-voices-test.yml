# SPIKE: builds "CyPress Voices Test", a separate app (com.cypress.reader.voices) that installs NEXT TO the real one,
# with one on-device neural voice (sherpa-onnx 2.0.1 + Piper LJSpeech, public domain) to try on the phone.
# Published as the PRE-RELEASE "voices-test": the real app's updater only looks at the latest full release, so it never sees it.
# Plan: review/tts-plan.md. Delete this file when the spike is over.
name: Build voices test APK

on:
  push:
    branches: [ccr-1d67488b-0prx87, preview/neural-tts]
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: voices-test
  cancel-in-progress: true

env:
  ICON: tree
  EXTRAS: "1"
  BUILD_NUMBER: ${{ github.run_number }}
  APP_LABEL: "1.226-voices"
  SHERPA: "2.0.1"
  VOICE: en_US-ljspeech-medium

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Create the Android project
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
          npx cap add android
          python3 scripts/prepare_android.py

      - name: Download the voice engine and the voice
        run: |
          set -e
          mkdir -p android/app/libs
          curl -fSL -o android/app/libs/sherpa-onnx.aar "https://github.com/k2-fsa/sherpa-onnx/releases/download/v${SHERPA}/sherpa-onnx-${SHERPA}.aar"
          D="android/app/src/main/assets/voices/${VOICE}"
          mkdir -p "$D"
          curl -fSL -o "$D/${VOICE}.onnx" "https://huggingface.co/csukuangfj/vits-piper-${VOICE}/resolve/main/${VOICE}.onnx"
          curl -fSL -o "$D/tokens.txt" "https://huggingface.co/csukuangfj/vits-piper-${VOICE}/resolve/main/tokens.txt"
          curl -fSL -o "$D/lexicon-en-us.txt" "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/lexicon-en-us.txt"
          ls -lh android/app/libs "$D"

      - name: Licence check (no eSpeak anywhere)
        run: |
          set -e
          if unzip -l android/app/libs/sherpa-onnx.aar | grep -i espeak; then
            echo "::error title=eSpeak found::The engine package contains eSpeak files (GPL). Stop."; exit 1
          fi
          if find android/app/src/main/assets -iname '*espeak*' | grep .; then
            echo "::error title=eSpeak found::The voice files contain eSpeak data (GPL). Stop."; exit 1
          fi
          unzip -l android/app/libs/sherpa-onnx.aar | grep '\.so$'
          N=$(unzip -p android/app/libs/sherpa-onnx.aar 'jni/arm64-v8a/*.so' | strings | grep -ic espeak || true)
          echo "::notice title=eSpeak text in engine libraries::${N} line(s) mention eSpeak (listed below; error messages are fine, code is not)."
          unzip -p android/app/libs/sherpa-onnx.aar 'jni/arm64-v8a/*.so' | strings | grep -i espeak | sort -u | head -40 || true

      - name: Turn the project into the voices test app
        run: |
          set -e
          cp native/voices/CyNeural.java android/app/src/main/java/com/cypress/reader/
          python3 - <<'PY'
          import re
          p = 'android/app/build.gradle'
          g = open(p, encoding='utf-8').read()
          g, n = re.subn(r'applicationId\s+"com\.cypress\.reader"', 'applicationId "com.cypress.reader.voices"', g)
          assert n == 1, 'applicationId not found'
          a = "implementation project(':capacitor-android')"
          assert a in g, 'dependency anchor not found'
          g = g.replace(a, a + "\n    implementation files('libs/sherpa-onnx.aar')\n    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.0.21'", 1)
          g, n = re.subn(r'(defaultConfig\s*\{)', r"\1\n        ndk { abiFilters 'arm64-v8a' }", g, count=1)
          assert n == 1, 'defaultConfig not found'
          open(p, 'w', encoding='utf-8').write(g)
          s = 'android/app/src/main/res/values/strings.xml'
          x = open(s, encoding='utf-8').read()
          x, n = re.subn(r'(<string name="app_name">)[^<]*(</string>)', r'\1CyPress Voices Test\2', x)
          print('app name set' if n else 'app_name not found, keeping the name')
          open(s, 'w', encoding='utf-8').write(x)
          PY
          npx cap sync android

      - name: Build
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - name: Sign
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -e
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/k.keystore"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          U=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          "$BT/zipalign" -f -p 4 "$U" "$RUNNER_TEMP/a.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/k.keystore" --ks-pass env:KS_PASS --ks-key-alias cypress --out cypress-voices-test.apk "$RUNNER_TEMP/a.apk"
          rm -f "$RUNNER_TEMP/k.keystore"
          ls -lh cypress-voices-test.apk

      - uses: actions/upload-artifact@v4
        with:
          name: cypress-voices-test
          path: cypress-voices-test.apk
          retention-days: 14

      - name: Publish as the pre-release "voices-test"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete voices-test --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release create voices-test cypress-voices-test.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "CyPress Voices Test (build ${BUILD_NUMBER}, not an update)" \
            --notes "Test app with one new natural voice. Installs next to CyPress Reader, it does not replace it. Open a story, pick \"New natural voice (test)\" in Settings > Listen, then press Listen. Uninstall it when you're done."
          echo "Download: https://github.com/${GITHUB_REPOSITORY}/releases/tag/voices-test" >> "$GITHUB_STEP_SUMMARY"
