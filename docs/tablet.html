<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=1024">
<title>CyPress Reader on a tablet (made-up sample stories)</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#123524"><link rel="icon" href="logo.png">
<link rel="stylesheet" href="fonts.css">
<style>
:root{--grn:#123524;--line:#2a4a38;--brass:#c9a24a;--cream:#f3ecdc;--mut:#c9bd9f;--sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--serif:'Cormorant Garamond',Georgia,serif}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--grn)}
body{background:var(--grn);color:var(--cream);font:17px/1.6 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit}
:focus-visible{outline:3px solid var(--brass);outline-offset:3px;border-radius:4px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 28px;border-bottom:1px solid var(--line)}
.top a.b{display:inline-flex;align-items:center;gap:12px;text-decoration:none;font:600 26px/1 var(--serif)}
.top a.b img{width:30px;height:42px;object-fit:contain}
.top a.back{font:600 15px var(--sans);letter-spacing:.04em;text-decoration:none;border:1px solid var(--brass);border-radius:999px;padding:12px 22px;color:var(--cream)}
.top a.back:hover{background:rgba(201,162,74,.14)}
main{max-width:1024px;margin:0 auto;padding:30px 28px 48px;text-align:center}
h1{font:500 44px/1.15 var(--serif)}
h1 em{color:var(--brass)}
.note{color:var(--mut);margin:10px auto 26px;max-width:36em}
.frame{background:#08130d;border:2px solid var(--line);border-radius:30px;padding:14px;box-shadow:0 60px 110px -30px rgba(0,0,0,.75);max-width:968px;margin:0 auto}
.screen{position:relative;aspect-ratio:1024/768;border-radius:16px;overflow:hidden;background:#0a1a10}
.screen iframe{position:absolute;left:0;top:0;width:1024px;height:768px;border:0;transform-origin:0 0;transform:scale(var(--s,.93))}
.small{font-size:14.5px;color:var(--mut);margin-top:20px}
</style></head>
<body>
<header class="top"><a class="b" href="index.html"><img src="cypress-tree-badge.png" width="30" height="42" alt="">CyPress Reader</a><a class="back" href="index.html">Back to the site</a></header>
<main>
 <h1>The tablet layout, <em>live.</em></h1>
 <p class="note">Tap and scroll to try it. On a phone, turn it sideways for a bigger view, and pinch to zoom.</p>
 <div class="frame"><div class="screen" id="screen"><iframe id="f" title="CyPress Reader live demo on a tablet, with made-up sample stories" sandbox="allow-scripts" src="demo.html"></iframe></div></div>
 <p class="small">The stories are invented for this demo. They are not real news.</p>
</main>
<script>
(function(){var sc=document.getElementById('screen'),f=document.getElementById('f');function fit(){f.style.setProperty('--s',(sc.clientWidth/1024).toFixed(4))}fit();window.addEventListener('resize',fit)})();
</script>
</body></html>
