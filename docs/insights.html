<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>CyPress Insights</title>
<link rel="stylesheet" href="fonts.css">
<style>
:root{--bg:#f3ecdc;--pn:#fbf7ee;--ink:#123524;--mut:#5b6b60;--ln:#ddd3bd;--bar:#1f5a3c;--bar2:#c9a24a;--warn:#9a3412;--grid:#e6dcc6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c2619;--pn:#123524;--ink:#f3ecdc;--mut:#a9b8ad;--ln:#24503a;--bar:#7fc49b;--bar2:#e2c27a;--warn:#fb923c;--grid:#1d4430}}
:root[data-theme="dark"]{--bg:#0c2619;--pn:#123524;--ink:#f3ecdc;--mut:#a9b8ad;--ln:#24503a;--bar:#7fc49b;--bar2:#e2c27a;--warn:#fb923c;--grid:#1d4430}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
main{max-width:1180px;margin:0 auto;padding:28px 16px 64px}
h1{font:600 clamp(2rem,5vw,3rem)/1.05 'Cormorant Garamond',Georgia,serif;margin:0}
h2{font:600 1.35rem/1.2 'Cormorant Garamond',Georgia,serif;margin:0 0 12px}
.sub{color:var(--mut);margin:6px 0 22px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:end;justify-content:space-between;margin-bottom:8px}
.seg{display:inline-flex;border:1px solid var(--ln);border-radius:999px;overflow:hidden;background:var(--pn)}
.seg button{border:0;background:none;color:var(--ink);padding:7px 14px;font:inherit;cursor:pointer;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
button,input{font:inherit}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:999px;padding:8px 18px;cursor:pointer;min-height:40px}
.btn.ghost{background:none;color:var(--ink);border-color:var(--ln)}
:focus-visible{outline:2px solid var(--bar2);outline-offset:2px}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:18px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr))}
.kpis{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));margin-bottom:14px}
.kpi b{display:block;font:600 2.4rem/1 'Cormorant Garamond',Georgia,serif;margin:6px 0 4px}
.kpi span,.note{color:var(--mut);font-size:.85rem}
.wide{grid-column:1/-1}
.bars{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.bars li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;font-size:.9rem}
.bars .tr{grid-column:1/-1;height:8px;background:var(--grid);border-radius:4px;overflow:hidden}
.bars .tr i{display:block;height:100%;background:var(--bar);border-radius:0 4px 4px 0}
.bars .v{color:var(--mut);font-variant-numeric:tabular-nums}
.col{display:flex;align-items:flex-end;gap:2px;height:180px;border-bottom:1px solid var(--ln);padding-top:8px}
.col div{flex:1;min-width:3px;background:var(--bar);border-radius:4px 4px 0 0;position:relative;cursor:default}
.col div:hover,.col div:focus{background:var(--bar2)}
.col div:hover::after,.col div:focus::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--ink);color:var(--bg);font-size:.78rem;padding:4px 8px;border-radius:6px;z-index:2}
.axis{display:flex;justify-content:space-between;color:var(--mut);font-size:.78rem;margin-top:6px}
.rep{border-top:1px solid var(--ln);padding:12px 0}
.rep:first-of-type{border-top:0}
.rep p{margin:4px 0;white-space:pre-wrap}
.rep pre{white-space:pre-wrap;font-size:.78rem;color:var(--mut);background:var(--bg);padding:10px;border-radius:8px;overflow:auto}
.err{color:var(--warn)}
#gate{max-width:420px;margin:12vh auto 0}
#gate label{display:block;font-weight:600;margin:16px 0 6px}
#gate input[type=password]{width:100%;padding:10px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--pn);color:var(--ink)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.empty{color:var(--mut);font-style:italic}
</style>
</head>
<body>
<main>
<section id="gate" hidden>
 <h1>Insights</h1>
 <p class="sub">Private. Enter the key you saved as INSIGHTS_KEY in Cloudflare.</p>
 <form id="kf">
  <label for="key">Key</label>
  <input id="key" type="password" autocomplete="current-password" required>
  <div class="row"><label style="margin:0;font-weight:400"><input type="checkbox" id="keep" checked> Remember on this browser</label></div>
  <div class="row"><button class="btn" type="submit">Open</button><a href="?demo" class="note">See it with sample data</a></div>
  <p id="kmsg" class="err" role="alert"></p>
 </form>
</section>
<section id="dash" hidden>
 <header>
  <div><h1>CyPress Insights</h1><p class="sub" id="basis"></p></div>
  <div class="row" style="margin:0">
   <div class="seg" role="group" aria-label="Time range" id="rng"><button data-w="4">4 weeks</button><button data-w="12" aria-pressed="true">12 weeks</button><button data-w="52">1 year</button></div>
   <button class="btn ghost" id="out">Forget key</button>
  </div>
 </header>
 <div class="kpis" id="kpis"></div>
 <div class="grid" id="charts"></div>
</section>
</main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let DATA=null,WEEKS=12;
const LS={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
const DAY=864e5,wk=d=>{const t=new Date(d+'T00:00:00Z');return new Date(t-((t.getUTCDay()+6)%7)*DAY).toISOString().slice(0,10)};
const FEAT={open:'Stories opened',aloud:'Read aloud',share:'Shares',save:'Saves',near:'Near you',side:'Side by side',find:'Searches'};
const DIMS=[['v','App version'],['dev','Device type'],['os','System'],['p','App or website'],['lang','Language'],['th','Theme'],['sch','Light or dark'],['sz','Card size'],['vw','View'],['cv','Cover'],['fn','Font'],['sp','Side by side setting'],['nv','Natural voice'],['fd','Number of sites'],['sv','Saved stories'],['fo','Folders']];

function demo(){const r=[],now=Date.now(),pick=a=>a[Math.random()*a.length|0],vs=['1.228','1.229','1.230','1.231'];
 for(let w=51;w>=0;w--){const n=Math.round(8+(51-w)*1.6+Math.random()*6);for(let i=0;i<n;i++){const d=new Date(now-w*7*DAY-Math.random()*6*DAY).toISOString().slice(0,10);
  r.push({d,v:vs[Math.min(3,Math.max(0,3-Math.floor(w/3)-(Math.random()<.2)))],p:Math.random()<.85?'app':'web',os:pick(['Android 14','Android 15','Android 16','Android 13']),dev:pick(['phone','phone','phone','fold','tablet']),lang:pick(['en','en','en','es','de']),th:pick(['halcyon','halcyon','light','oled','rosewood','eink']),sch:pick(['sys','sys','light','dark']),sz:pick(['compact','medium','medium','large']),vw:pick(['tiles','tiles','list']),cv:pick(['clean','auto','gazette','magazine']),fn:pick(['theme','theme','literata']),sp:pick(['land','off','always']),nv:pick(['none','phone','compact','full']),fd:pick(['1-5','6-20','6-20','21-50']),sv:pick(['0','1-5','6-20']),fo:pick(['0','1-5']),
  f:{open:20+Math.random()*60|0,aloud:Math.random()*8|0,share:Math.random()*4|0,save:Math.random()*10|0,near:Math.random()*3|0,side:Math.random()*5|0,find:Math.random()*6|0},e:Math.random()<.3?1+(Math.random()*4|0):0,em:Math.random()<.3?[pick(["Cannot read properties of null (reading 'style')",'Failed to fetch','The operation was aborted.'])]:[]})}}
 return{stats:r,reports:[{t:now-2*DAY,v:'1.231',msg:'Read aloud stopped after the first paragraph on a long story.',info:'CyPress diagnostics\napp 2026.11.02e · native 1.231\nscreen 904x2316 @2.6'},{t:now-9*DAY,v:'1.230',msg:'Photos missing on the Daily cover this morning.',info:'CyPress diagnostics\napp 2026.11.02e · web'}]}}

async function open(key,keep){$('#kmsg').textContent='';
 if(key==='demo'){DATA=demo();return show()}
 try{const r=await fetch('/api/insights',{headers:{authorization:'Bearer '+key},cache:'no-store'});
  if(r.status===401){LS.set('cy-ins',null);throw new Error('That key is not right.')}
  if(r.status===501)throw new Error('Insights are not set up on the server yet. See docs/worker/INSIGHTS.md.');
  if(!r.ok)throw new Error('The server answered '+r.status+'. Try again in a minute.');
  DATA=await r.json();if(keep)LS.set('cy-ins',key);show()}
 catch(e){$('#gate').hidden=false;$('#dash').hidden=true;$('#kmsg').textContent=e.message||'Could not load.'}}

function count(rows,k){const m={};rows.forEach(x=>{const v=x[k]==null||x[k]===''?'unknown':x[k];m[v]=(m[v]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function bars(list,total,fmt){if(!list.length)return '<p class="empty">Nothing yet</p>';const max=Math.max(...list.map(x=>x[1]));
 return '<ul class="bars">'+list.slice(0,8).map(([k,n])=>`<li><span>${esc(k)}</span><span class="v">${fmt?fmt(n):Math.round(n/total*100)+'% · '+n}</span><span class="tr"><i style="width:${Math.max(2,n/max*100)}%"></i></span></li>`).join('')+(list.length>8?`<li class="note">and ${list.length-8} more</li>`:'')+'</ul>'}
function card(t,body,cls,note){return `<section class="card ${cls||''}"><h2>${esc(t)}</h2>${body}${note?`<p class="note">${note}</p>`:''}</section>`}

function show(){$('#gate').hidden=true;$('#dash').hidden=false;
 const now=Date.now(),from=new Date(now-WEEKS*7*DAY).toISOString().slice(0,10);
 const rows=DATA.stats.filter(x=>x.d>=from),reps=DATA.reports.filter(x=>x.t>=now-WEEKS*7*DAY);
 const byW={};rows.forEach(x=>{const w=wk(x.d);(byW[w]=byW[w]||[]).push(x)});
 const weeks=[];for(let i=WEEKS-1;i>=0;i--)weeks.push(wk(new Date(now-i*7*DAY).toISOString().slice(0,10)));
 const ds=n=>new Date(now-n*DAY).toISOString().slice(0,10),thisW=DATA.stats.filter(x=>x.d>ds(7)).length,lastW=DATA.stats.filter(x=>x.d>ds(14)&&x.d<=ds(7)).length;
 const errs=rows.reduce((n,x)=>n+(+x.e||0),0),withE=rows.filter(x=>+x.e>0).length;
 const vTop=count(rows,'v').sort((a,b)=>b[0].localeCompare(a[0],undefined,{numeric:true}))[0];
 const delta=lastW?Math.round((thisW-lastW)/lastW*100):0;
 $('#basis').textContent=rows.length?`Based on ${rows.length} weekly check-ins from people who turned on usage counts. One check-in is one device in one week; there are no IDs.`:'No check-ins in this period yet.';
 $('#kpis').innerHTML=[
  ['Devices, last 7 days',thisW,lastW?(delta>=0?'+':'')+delta+'% from the 7 days before':'no data for the 7 days before'],
  ['Problem reports',reps.length,'written by people in this period'],
  ['Check-ins with errors',rows.length?Math.round(withE/rows.length*100)+'%':'–',errs+' errors in total'],
  ['Newest version',vTop?vTop[0]:'–',vTop?Math.round(vTop[1]/rows.length*100)+'% of check-ins':'']
 ].map(([a,b,c])=>`<div class="card kpi"><span>${a}</span><b>${esc(b)}</b><span>${esc(c)}</span></div>`).join('');
 const mx=Math.max(1,...weeks.map(w=>(byW[w]||[]).length));
 let h=card('Devices checking in each week','<div class="col" role="img" aria-label="Devices per week">'+weeks.map(w=>{const n=(byW[w]||[]).length;return `<div tabindex="0" style="height:${n/mx*100}%" data-tip="Week of ${w}: ${n}" aria-label="Week of ${w}: ${n} devices"></div>`}).join('')+`</div><div class="axis"><span>${weeks[0]}</span><span>${weeks[weeks.length-1]} (so far)</span></div>`,'wide');
 const fu=Object.keys(FEAT).map(k=>[FEAT[k],rows.filter(x=>x.f&&x.f[k]>0).length,rows.reduce((n,x)=>n+(x.f&&x.f[k]||0),0)]).sort((a,b)=>b[1]-a[1]);
 h+=card('Features people use',bars(fu.map(x=>[x[0],x[1]]),rows.length,n=>rows.length?Math.round(n/rows.length*100)+'% of weeks':''),'',rows.length?'Share of weekly check-ins where the feature was used at least once. Average per week: '+fu.map(x=>esc(x[0].toLowerCase())+' '+(x[2]/rows.length).toFixed(1)).join(', ')+'.':'');
 for(const [k,t] of DIMS)h+=card(t,bars(count(rows,k),rows.length));
 const em={};rows.forEach(x=>(x.em||[]).forEach(m=>em[m]=(em[m]||0)+1));
 h+=card('Most common errors',bars(Object.entries(em).sort((a,b)=>b[1]-a[1]),1,n=>n+'×'),'wide','Error messages the app recorded, with any web addresses removed.');
 h+=card('Problem reports',reps.length?reps.sort((a,b)=>b.t-a.t).map(r=>`<div class="rep"><span class="note">${new Date(r.t).toLocaleString()} · ${esc(r.v||'unknown version')}</span><p>${esc(r.msg)}</p><details><summary>Details sent with it</summary><pre>${esc(r.info||'')}</pre></details></div>`).join(''):'<p class="empty">No reports in this period</p>','wide');
 $('#charts').innerHTML=h}

$('#kf').onsubmit=e=>{e.preventDefault();open($('#key').value.trim(),$('#keep').checked)};
$('#out').onclick=()=>{LS.set('cy-ins',null);DATA=null;$('#key').value='';$('#dash').hidden=true;$('#gate').hidden=false;history.replaceState(null,'',location.pathname)};
$('#rng').onclick=e=>{const b=e.target.closest('[data-w]');if(!b)return;WEEKS=+b.dataset.w;$('#rng').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));if(DATA)show()};
if(/[?&]demo\b/.test(location.search))open('demo');else if(LS.get('cy-ins'))open(LS.get('cy-ins'),true);else $('#gate').hidden=false;
</script>
</body>
</html>
